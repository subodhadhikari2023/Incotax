# Local development and testing. Production is built and hosted by Netlify, not Docker.
# Every service uses the official Playwright image (Node 24 + test browsers), so dev,
# tests and CI share one environment. Keep the tag in sync with @playwright/test.

x-node: &node
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  working_dir: /app
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app:z
  environment:
    HOME: /tmp
    npm_config_cache: /tmp/.npm
    NEXT_TELEMETRY_DISABLED: "1"
  init: true
  ipc: host

services:
  app:
    <<: *node
    command: npm run dev -- --hostname 0.0.0.0
    ports:
      - "3000:3000"

  # Production build served like Netlify would (compiled once, no hot reload) on port 3001, so it
  # can run next to the dev server. Start with: docker compose up prod
  prod:
    <<: *node
    profiles: ["tools"]
    command: sh -c "npm run build && npm run start -- --hostname 0.0.0.0 --port 3001"
    ports:
      - "3001:3001"

  test:
    <<: *node
    profiles: ["tools"]
    command: npm test

  e2e:
    <<: *node
    profiles: ["tools"]
    command: npm run test:e2e
    ports:
      - "9323:9323"
