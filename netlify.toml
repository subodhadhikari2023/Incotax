# Netlify build settings. The Next.js runtime is declared below: auto-detection didn't add it on the
# first deploy, so Netlify published the raw .next folder and every page was a 404.
# The site's main domain reaches the build as URL, which src/lib/site-url.ts uses for absolute links.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Keep equal to .nvmrc.
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"
